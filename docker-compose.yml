services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kashmir-sheeps-app:latest
    restart: unless-stopped
    environment:
      APP_NAME: "Kashmir Sheeps Marketplace"
      APP_ENV: production
      APP_KEY: base64:wXz0j0hS3bV6H2Fk9e8l4g7y1q5a3c2e1b4d6f8a0c=
      APP_DEBUG: "false"
      APP_URL: "http://localhost"
      LOG_CHANNEL: stderr
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    volumes:
      - app-storage:/var/www/html/storage
      - app-database:/var/www/html/database
    healthcheck:
      test: ["CMD-SHELL", "php -r \"echo file_get_contents('http://localhost/health') !== false ? 0 : 1;\""]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - kashmir-net

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - kashmir-net

volumes:
  app-storage:
  app-database:

networks:
  kashmir-net:
    driver: bridge
